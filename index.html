<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <div class="ludo-board" id="board">
      <!-- Home Boxes -->
      <div class="home red-home">
        <div class="box"><div class="token red" id="red-t1"></div></div>
        <div class="box"><div class="token red" id="red-t2"></div></div>
        <div class="box"><div class="token red" id="red-t3"></div></div>
        <div class="box"><div class="token red" id="red-t4"></div></div>
      </div>

      <div class="home green-home">
        <div class="box"><div class="token green" id="green-t1"></div></div>
        <div class="box"><div class="token green" id="green-t2"></div></div>
        <div class="box"><div class="token green" id="green-t3"></div></div>
        <div class="box"><div class="token green" id="green-t4"></div></div>
      </div>

      <div class="home yellow-home">
        <div class="box"><div class="token yellow" id="yellow-t1"></div></div>
        <div class="box"><div class="token yellow" id="yellow-t2"></div></div>
        <div class="box"><div class="token yellow" id="yellow-t3"></div></div>
        <div class="box"><div class="token yellow" id="yellow-t4"></div></div>
      </div>

      <div class="home blue-home">
        <div class="box"><div class="token blue" id="blue-t1"></div></div>
        <div class="box"><div class="token blue" id="blue-t2"></div></div>
        <div class="box"><div class="token blue" id="blue-t3"></div></div>
        <div class="box"><div class="token blue" id="blue-t4"></div></div>
      </div>

      <!-- Center Winning Square -->
      <div class="center-square"></div>
    </div>

    <!-- Game Controls -->
    <div class="controls">
      <div id="status">Turn: <span id="player-turn" style="color: #2ecc71;">GREEN</span></div>
      <div id="dice-display">🎲 0</div>
      <button id="roll-btn" onclick="rollDice()">Roll Dice</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
